<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" data-anchor-feet="32,56" data-anchor-eyes="28,17 36,17" data-anchor-book="32,34">
  <!-- Direction A "Librarian": seen from above, wings folded into a tent (delta) over the body -->
