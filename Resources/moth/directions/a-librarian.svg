    <path d="M29 11 C26 7, 21 5, 16 6"/>
    <path d="M35 11 C38 7, 43 5, 48 6"/>
    <path d="M17 4.6 v3 M20 4.4 v3.2 M23 4.8 v3 M26 5.6 v2.8" stroke-width="1"/>
    <path d="M47 4.6 v3 M44 4.4 v3.2 M41 4.8 v3 M38 5.6 v2.8" stroke-width="1"/>
  </g>
  <g id="body" fill="var(--moth-body)">
    <ellipse cx="32" cy="44" rx="4" ry="14"/>
  </g>
  <g id="wing-left" fill="var(--moth-wing)">
    <path d="M32 22 L9 50 C8 54, 12 57, 16 55 L32 47 Z"/>
    <path d="M18 44 L13 50" stroke="var(--moth-wing-mark)" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    <path d="M24 34 L15 44" stroke="var(--moth-wing-mark)" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>
  <g id="wing-right" fill="var(--moth-wing)">
    <path d="M32 22 L55 50 C56 54, 52 57, 48 55 L32 47 Z"/>
    <path d="M46 44 L51 50" stroke="var(--moth-wing-mark)" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    <path d="M40 34 L49 44" stroke="var(--moth-wing-mark)" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>
  <g id="thorax" fill="var(--moth-body)">
    <ellipse cx="32" cy="25" rx="7.5" ry="5"/>
    <path d="M25 24 l-2.5 1 M26 27 l-2.5 1.5 M39 24 l2.5 1 M38 27 l2.5 1.5" stroke="var(--moth-body)" stroke-width="1.3" stroke-linecap="round" fill="none"/>
  </g>
  <g id="head" fill="var(--moth-body)">
    <circle cx="32" cy="17" r="6"/>
  </g>
  <g id="eyes">
    <circle cx="28.5" cy="17" r="2.4" fill="var(--moth-eye-white)"/>
    <circle cx="35.5" cy="17" r="2.4" fill="var(--moth-eye-white)"/>
    <circle cx="29" cy="17.4" r="1.1" fill="var(--moth-eye)"/>
    <circle cx="36" cy="17.4" r="1.1" fill="var(--moth-eye)"/>
  </g>
  <g id="glasses" fill="none" stroke="var(--moth-glasses)" stroke-width="1.3">
    <circle cx="28.5" cy="17" r="3.4"/>
    <circle cx="35.5" cy="17" r="3.4"/>
    <path d="M32.1 17 h-0.2"/>
  </g>
  <g id="book">
    <path d="M23 36 L32 39 L41 36 L41 30 L32 33 L23 30 Z" fill="var(--moth-book)"/>
    <path d="M25 34.5 L32 37 L39 34.5 L39 31.5 L32 34 L25 31.5 Z" fill="var(--moth-page)"/>
