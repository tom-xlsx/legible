<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" data-anchor-feet="34,50" data-anchor-eyes="15,21 22,21" data-anchor-book="14,42">
  <!-- Direction C "Scruffy": side view of a clothes-moth tent; wings slope back from a fuzzy collar, ragged trailing edge, head forward -->
