  </g>
  <g id="glasses" fill="none" stroke="var(--moth-glasses)" stroke-width="1.3">
    <circle cx="15" cy="21" r="3.4"/>
    <circle cx="22" cy="21" r="3.4"/>
    <path d="M18.6 21 h-0.2"/>
    <path d="M25.4 20.4 l2.4 -0.6"/>
  </g>
  <g id="book">
    <path d="M5 44 L14 47 L23 44 L23 38 L14 41 L5 38 Z" fill="var(--moth-book)"/>
    <path d="M7 42.5 L14 45 L21 42.5 L21 39.5 L14 42 L7 39.5 Z" fill="var(--moth-page)"/>
