    <path d="M21 14 C22 8, 27 5, 32 6"/>
    <path d="M4 8.2 v3 M7 7.8 v3 M10 8 v3 M13 9.4 v2.6" stroke-width="1"/>
    <path d="M31 4.4 v3 M28 4.6 v3 M25 5.4 v3 M23 7.2 v2.4" stroke-width="1"/>
  </g>
  <g id="tail" fill="var(--moth-body)">
    <ellipse cx="57" cy="33" rx="5" ry="2.6" transform="rotate(12 57 33)"/>
  </g>
  <g id="wing-far" fill="var(--moth-wing)" opacity="0.7">
    <path d="M24 22 L58 24 L58 34 L52 38 L46 35 L40 40 L34 37 L28 41 L23 36 Z"/>
  </g>
  <g id="wing-near" fill="var(--moth-wing)">
    <path d="M22 28 L58 31 L57 41 L50 46 L45 42 L39 48 L33 44 L27 49 L21 44 L18 36 Z"/>
    <path d="M27 33 L50 35" stroke="var(--moth-wing-mark)" stroke-width="1.3" stroke-linecap="round" fill="none"/>
    <path d="M27 40 L46 41" stroke="var(--moth-wing-mark)" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.6"/>
    <circle cx="40" cy="38" r="1.5" fill="var(--moth-wing-mark)"/>
  </g>
  <g id="thorax" fill="var(--moth-body)">
    <ellipse cx="22" cy="28" rx="8" ry="6"/>
    <path d="M15 25 l-3 0 M15 29 l-3 1.5 M16 33 l-2.5 2.5" stroke="var(--moth-body)" stroke-width="1.3" stroke-linecap="round" fill="none"/>
  </g>
  <g id="head" fill="var(--moth-body)">
    <circle cx="18" cy="21" r="6"/>
  </g>
  <g id="eyes">
    <circle cx="15" cy="21" r="2.4" fill="var(--moth-eye-white)"/>
    <circle cx="22" cy="21" r="2.4" fill="var(--moth-eye-white)"/>
    <circle cx="14.6" cy="21.4" r="1.1" fill="var(--moth-eye)"/>
