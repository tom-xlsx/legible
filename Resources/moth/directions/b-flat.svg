<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" data-anchor-feet="32,50" data-anchor-eyes="28,18 36,18" data-anchor-book="32,42">
  <!-- Direction B "Flat": wings spread flat and angular like a resting geometrid, body down the middle -->
  <g id="antennae" fill="none" stroke="var(--moth-body)" stroke-width="1.4" stroke-linecap="round">
    <path d="M29 12 C27 7, 22 4, 17 5"/>
    <path d="M35 12 C37 7, 42 4, 47 5"/>
    <path d="M18 3.4 v3 M21 3.4 v3 M24 4 v3 M27 5.4 v2.6" stroke-width="1"/>
    <path d="M46 3.4 v3 M43 3.4 v3 M40 4 v3 M37 5.4 v2.6" stroke-width="1"/>
  </g>
  <g id="wing-left" fill="var(--moth-wing)">
    <path d="M31 24 L4 30 L6 42 L18 47 L31 44 Z"/>
    <path d="M9 33 L26 30" stroke="var(--moth-wing-mark)" stroke-width="1.3" stroke-linecap="round" fill="none"/>
    <path d="M10 40 L24 39" stroke="var(--moth-wing-mark)" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.6"/>
    <circle cx="14" cy="36" r="1.5" fill="var(--moth-wing-mark)"/>
  </g>
  <g id="wing-right" fill="var(--moth-wing)">
    <path d="M33 24 L60 30 L58 42 L46 47 L33 44 Z"/>
    <path d="M55 33 L38 30" stroke="var(--moth-wing-mark)" stroke-width="1.3" stroke-linecap="round" fill="none"/>
    <path d="M54 40 L40 39" stroke="var(--moth-wing-mark)" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.6"/>
    <circle cx="50" cy="36" r="1.5" fill="var(--moth-wing-mark)"/>
  </g>
  <g id="body" fill="var(--moth-body)">
    <ellipse cx="32" cy="38" rx="4.5" ry="13"/>
    <ellipse cx="32" cy="26" rx="7" ry="4.5"/>
  </g>
  <g id="head" fill="var(--moth-body)">
    <circle cx="32" cy="18" r="6"/>
  </g>
  <g id="eyes">
    <circle cx="28.5" cy="18" r="2.4" fill="var(--moth-eye-white)"/>
    <circle cx="35.5" cy="18" r="2.4" fill="var(--moth-eye-white)"/>
    <circle cx="29" cy="18.4" r="1.1" fill="var(--moth-eye)"/>
    <circle cx="36" cy="18.4" r="1.1" fill="var(--moth-eye)"/>
  </g>
  <g id="glasses" fill="none" stroke="var(--moth-glasses)" stroke-width="1.3">
    <circle cx="28.5" cy="18" r="3.4"/>
    <circle cx="35.5" cy="18" r="3.4"/>
    <path d="M32.1 18 h-0.2"/>
  </g>
  <g id="book">
    <path d="M24 46 L32 49 L40 46 L40 40 L32 43 L24 40 Z" fill="var(--moth-book)"/>
    <path d="M26 44.5 L32 47 L38 44.5 L38 41.5 L32 44 L26 41.5 Z" fill="var(--moth-page)"/>
  </g>
</svg>
